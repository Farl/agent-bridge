[project]
name = "agent-bridge"
version = "0.1.0"
description = "Two-way messaging between running Claude Code sessions and Codex threads on one machine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-bridge = "agent_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bridge"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
